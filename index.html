<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de EPIs — LSG Sky Chefs</title>
    <link rel="icon" type="image/png" href="/icone lsg.ico" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #f0f4f8; }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes epi-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes epi-toast-in {
        from { opacity: 0; transform: translateY(12px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes epi-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.75; transform: scale(0.97); }
      }
      button { transition: transform 0.08s ease, box-shadow 0.15s ease, opacity 0.15s ease; }
      button:active { transform: scale(0.97); }
      /* Tabela visível no desktop, cards no mobile */
      @media (max-width: 700px) {
        [style*="desktopOnly"], .desktopOnly { display: none !important; }
        [style*="mobileOnly"],  .mobileOnly  { display: block !important; }
      }
      @media (min-width: 701px) {
        [style*="mobileOnly"],  .mobileOnly  { display: none !important; }
        [style*="desktopOnly"], .desktopOnly { display: block !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
